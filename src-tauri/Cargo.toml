[package]
name = "cyclone-iv-studio"
version = "0.1.0"
description = "Interactive Cyclone IV FPGA & RZ-EasyFPGA A2.2 Devboard Simulator"
authors = ["Cyclone IV Studio Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
