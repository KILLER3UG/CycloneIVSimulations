<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Cyclone IV Studio — RZ-EasyFPGA A2.2</title>
</head>
<body>
    <div id="drawer-backdrop" hidden></div>
    <div id="app">
        <header id="toolbar" aria-label="Main toolbar"></header>

        <aside id="left" aria-label="Components sidebar"></aside>

        <main id="board-area" aria-label="3D board view">
            <div id="board-host"></div>
            <div id="board-topbar" aria-label="Board view controls">
                <div class="seg" id="cam-presets" role="group" aria-label="Camera presets">
                    <button type="button" data-preset="top">Top</button>
                    <button type="button" data-preset="front">Front</button>
                    <button type="button" data-preset="iso" class="active">45&deg;</button>
                    <button type="button" data-preset="ports">Ports</button>
                </div>
                <div class="viewtools" role="group" aria-label="Zoom and fit">
                    <button class="icon-btn" id="bt-zoout" aria-label="Zoom out" title="Zoom out (-)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button class="icon-btn" id="bt-zoin" aria-label="Zoom in" title="Zoom in (+)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button class="icon-btn" id="bt-fit" aria-label="Fit board" title="Fit board (F)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </button>
                </div>
            </div>
            <div id="board-controls" class="board-controls hidden" aria-label="Board DIP and key controls">
                <div class="bc-head">
                    <span class="bc-title">DIP / keys</span>
                    <span class="bc-note">shared nets 88&ndash;91 &middot; active-low</span>
                </div>
                <div class="bc-row" id="bc-row"></div>
            </div>
            <div id="backend-banner" class="backend-banner hidden" role="alert">
                <span class="bb-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13.5"/><line x1="12" y1="17" x2="12" y2="17.1"/></svg>
                </span>
                <div>
                    <b>Backend disconnected</b>
                    <span>The simulator service is unreachable. Start it with <code>python -m backend serve</code>.</span>
                </div>
                <button class="btn" id="backend-retry" type="button">Retry</button>
            </div>
        </main>

        <aside id="right" aria-label="Source editor"></aside>

        <section id="bottom" aria-label="Diagnostics and output">
            <div id="bottompanel"></div>
        </section>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
